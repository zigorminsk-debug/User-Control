{% extends "base.html" %}
{% block title %}User Control — Отчёты{% endblock %}
{% block page_title %}📄 Генерация отчётов{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header">
        <div class="card-title">📄 Создание отчёта по безопасности</div>
    </div>
    <div style="padding:10px 0">
        <div class="form-group" style="display:flex;align-items:center;gap:12px;margin-bottom:16px">
            <label style="font-size:13px;color:#8899aa;min-width:180px">Период отчёта (часов):</label>
            <select id="reportHours" style="background:#162230;border:1px solid #2a3f52;color:#e8edf2;padding:8px 12px;border-radius:6px">
                <option value="6">Последние 6 часов</option>
                <option value="12">Последние 12 часов</option>
                <option value="24" selected>Последние 24 часа</option>
                <option value="48">Последние 48 часов</option>
                <option value="72">Последние 3 дня</option>
                <option value="168">Последняя неделя</option>
            </select>
        </div>
        <div style="display:flex;gap:12px;flex-wrap:wrap">
            <button class="btn btn-primary" onclick="generateReport()">📄 Сгенерировать HTML-отчёт</button>
            <button class="btn btn-secondary" onclick="App.exportCsv('access-denied')">📥 Экспорт: Отказы в доступе</button>
            <button class="btn btn-secondary" onclick="App.exportCsv('clipboard')">📥 Экспорт: Буфер обмена</button>
            <button class="btn btn-secondary" onclick="App.exportCsv('file-operations')">📥 Экспорт: Файловые операции</button>
            <button class="btn btn-secondary" onclick="App.exportCsv('login-events')">📥 Экспорт: Входы</button>
            <button class="btn btn-secondary" onclick="App.exportCsv('alerts')">📥 Экспорт: Оповещения</button>
        </div>
    </div>
</div>

<div class="card" id="reportResult" style="display:none">
    <div class="card-header">
        <div class="card-title">✅ Отчёт готов</div>
    </div>
    <div style="padding:16px">
        <p style="margin-bottom:12px" id="reportMessage"></p>
        <a id="reportLink" class="btn btn-primary" href="#" target="_blank">📥 Скачать отчёт</a>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function generateReport() {
    const hours = parseInt(document.getElementById('reportHours').value);
    const btn = event.target;
    btn.disabled = true;
    btn.textContent = '⏳ Генерация...';

    try {
        const resp = await fetch('/api/reports/generate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ hours: hours })
        });
        const data = await resp.json();
        if (data.status === 'ok') {
            const resultDiv = document.getElementById('reportResult');
            resultDiv.style.display = 'block';
            document.getElementById('reportMessage').textContent =
                `Отчёт за ${hours} часов сгенерирован: ${data.path}`;
            const filename = data.path.split('/').pop();
            document.getElementById('reportLink').href = `/api/reports/download/${filename}`;
            App.toast('Отчёт готов', `Файл: ${data.path}`, 'success');
        }
    } catch (e) {
        App.toast('Ошибка', e.message, 'critical');
    }

    btn.disabled = false;
    btn.textContent = '📄 Сгенерировать HTML-отчёт';
}
</script>
{% endblock %}
